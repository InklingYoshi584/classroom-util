<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座位表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: transparent;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag;
  }
  #container {
    display: flex; flex-direction: column;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 10px 14px;
    min-width: 200px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    -webkit-app-region: no-drag;
  }
  #title {
    font-size: 13px; font-weight: 700; color: #374151;
    text-align: center; margin-bottom: 6px; padding-bottom: 4px;
    border-bottom: 1px solid #f3f4f6;
    display: flex; align-items: center; justify-content: space-between;
    -webkit-app-region: drag;
  }
  #closeBtn {
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: #e5e7eb; color: #6b7280; font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: no-drag;
  }
  #closeBtn:hover { background: #ef4444; color: #fff; }
  #grid {
    display: grid; gap: 3px;
    -webkit-app-region: no-drag;
  }
  .seat-cell {
    width: 38px; height: 26px;
    background: #f3f4f6; border: 1px solid #e5e7eb;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #9ca3af;
  }
  .seat-cell.occupied {
    background: #dbeafe; border-color: #93c5fd;
    color: #1e40af; font-weight: 600;
  }
</style>
</head>
<body>
<div id="container">
  <div id="title">
    <span>座位表</span>
    <button id="closeBtn">&times;</button>
  </div>
  <div id="grid"></div>
</div>
<script>
(function() {
  var gridEl = document.getElementById('grid');
  var closeBtn = document.getElementById('closeBtn');
  closeBtn.addEventListener('click', function() {
    if (window.electronAPI) window.electronAPI.closeSeatingChart();
  });
  function renderSeating(layout) {
    if (!layout) return;
    gridEl.style.gridTemplateColumns = 'repeat(' + layout.cols + ', 1fr)';
    gridEl.innerHTML = '';
    var seats = layout.seats || {};
    for (var r = 0; r < layout.rows; r++) {
      for (var c = 0; c < layout.cols; c++) {
        var key = r + '-' + c;
        var name = seats[key] || null;
        var cell = document.createElement('div');
        cell.className = 'seat-cell' + (name ? ' occupied' : '');
        cell.textContent = name || '';
        cell.title = name || '';
        gridEl.appendChild(cell);
      }
    }
  }
  if (window.electronAPI && window.electronAPI.onSeatingUpdate) {
    window.electronAPI.onSeatingUpdate(function(layout) { renderSeating(layout); });
  }
})();
</script>
</body>
</html>
