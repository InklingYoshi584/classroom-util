<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
  }
  #container {
    background: #1f2937;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 10px 14px;
    min-width: 260px;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    -webkit-app-region: no-drag;
    color: #e5e7eb;
  }
  #title {
    font-size: 13px;
    font-weight: 700;
    color: #d1d5db;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #closeBtn {
    width: 20px; height: 20px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: #9ca3af; font-size: 11px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #closeBtn:hover { background: rgba(239,68,68,0.5); color: #fff; }
  #dayTabs {
    display: flex; gap: 3px; margin-bottom: 8px;
    -webkit-app-region: no-drag;
  }
  #dayTabs button {
    flex: 1; padding: 4px 0; border: none; border-radius: 4px;
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4);
    font-size: 11px; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #dayTabs button.active {
    background: rgba(59,130,246,0.25); color: #93c5fd; font-weight: 600;
  }
  #dayTabs button:hover:not(.active) {
    background: rgba(255,255,255,0.08);
  }
  .sch-slot {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; margin-bottom: 3px;
    background: rgba(255,255,255,0.03);
    -webkit-app-region: no-drag;
  }
  .sch-slot.active {
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
  }
  .sch-slot.past { opacity: 0.35; }
  .sch-time {
    font-size: 10px; color: #6b7280; min-width: 85px; font-family: monospace;
  }
  .sch-slot.active .sch-time { color: #93c5fd; }
  .sch-name {
    font-size: 12px; font-weight: 600; color: #e5e7eb; flex: 1;
  }
  .sch-slot.active .sch-name { color: #fff; }
  .sch-empty {
    text-align: center; color: rgba(255,255,255,0.25); font-size: 12px; padding: 16px 0;
  }
</style>
</head>
<body>
<div id="container">
  <div id="title"><span>课表</span><button id="closeBtn">&times;</button></div>
  <div id="dayTabs"></div>
  <div id="slots"></div>
</div>
<script>
(function() {
  var dayTabs = document.getElementById('dayTabs');
  var slotsEl = document.getElementById('slots');
  var closeBtn = document.getElementById('closeBtn');
  var DAYS = ['mon','tue','wed','thu','fri'];
  var LABELS = ['一','二','三','四','五'];
  var currentDay = (new Date().getDay() + 6) % 7; // 0=Mon
  if (currentDay > 4) currentDay = 0;
  var periodConfig = null;
  var classSchedule = null;

  closeBtn.addEventListener('click', function() {
    if (window.electronAPI) window.electronAPI.closeSchedule();
  });

  function renderTabs() {
    dayTabs.innerHTML = DAYS.map(function(d, i) {
      return '<button class="' + (i === currentDay ? 'active' : '') + '" data-i="' + i + '">周' + LABELS[i] + '</button>';
    }).join('');
    dayTabs.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentDay = parseInt(this.dataset.i);
        renderTabs();
        renderSlots();
      });
    });
  }

  function renderSlots() {
    if (!periodConfig || !classSchedule) {
      slotsEl.innerHTML = '<div class="sch-empty">暂无课表数据</div>';
      return;
    }
    var day = DAYS[currentDay];
    var courses = (classSchedule[day] || []);
    var now = new Date();
    var current = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var isToday = (now.getDay() + 6) % 7 === currentDay;

    var html = '';
    periodConfig.periodTimes.forEach(function(pt, i) {
      var name = courses[i] || '';
      var isActive = isToday && current >= pt.start && current < pt.end;
      var isPast = isToday && current >= pt.end;
      html += '<div class="sch-slot' + (isActive ? ' active' : '') + (isPast ? ' past' : '') + '">';
      html += '<span class="sch-time">' + pt.start + '-' + pt.end + '</span>';
      html += '<span class="sch-name">' + (name || '--') + '</span>';
      html += '</div>';
    });
    slotsEl.innerHTML = html || '<div class="sch-empty">当天无课程安排</div>';
  }

  // Listen for data from main process
  if (window.electronAPI && window.electronAPI.onScheduleData) {
    window.electronAPI.onScheduleData(function(pc, sc) {
      periodConfig = pc;
      classSchedule = sc;
      renderTabs();
      renderSlots();
    });
  }

  renderTabs();
})();
</script>
</body>
</html>
