<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    -webkit-app-region: drag;
  }
  #container {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 14px;
    width: 300px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    -webkit-app-region: no-drag;
  }
  #title {
    font-size: 13px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    -webkit-app-region: drag;
  }
  #closeBtn {
    width: 20px; height: 20px;
    border: none; border-radius: 50%;
    background: #e5e7eb; color: #6b7280;
    font-size: 11px; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #closeBtn:hover { background: #ef4444; color: #fff; }
  .sch-slot {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 4px; margin-bottom: 2px;
  }
  .sch-slot.active {
    background: #dbeafe; border: 1px solid #93c5fd;
  }
  .sch-slot.past { opacity: 0.4; }
  .sch-time {
    font-size: 10px; color: #9ca3af; min-width: 80px; font-family: monospace;
  }
  .sch-slot.active .sch-time { color: #3b82f6; font-weight: 600; }
  .sch-name {
    font-size: 12px; font-weight: 600; color: #374151; flex: 1;
  }
  .sch-slot.active .sch-name { color: #1e40af; }
  .sch-empty {
    text-align: center; color: #9ca3af; font-size: 12px; padding: 16px 0;
  }
  /* ── Week view grid ── */
  .sch-week-grid {
    display: grid;
    grid-template-columns: auto 1fr 1fr 1fr 1fr 1fr;
    gap: 2px;
    font-size: 10px;
  }
  .sch-week-header {
    padding: 4px 2px; text-align: center;
    color: #6b7280; font-weight: 600;
  }
  .sch-week-time {
    padding: 3px 4px; color: #9ca3af; font-family: monospace;
    white-space: nowrap; text-align: right;
  }
  .sch-week-cell {
    padding: 3px 2px; text-align: center; border-radius: 3px;
    background: #f9fafb; color: #374151; font-weight: 500;
    min-height: 22px; display: flex; align-items: center; justify-content: center;
  }
  .sch-week-cell.active {
    background: #dbeafe; color: #1e40af; font-weight: 700;
  }
  .sch-week-cell.empty { background: #f9fafb; color: #d1d5db; }
  /* ── Toggle switch ── */
  .sch-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #6b7280; margin-bottom: 8px;
    -webkit-app-region: no-drag;
  }
  .sch-toggle-inner {
    width: 36px; height: 20px; border-radius: 10px;
    background: #d1d5db; cursor: pointer; position: relative;
    transition: background 0.15s;
  }
  .sch-toggle-inner.on { background: #3b82f6; }
  .sch-toggle-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    position: absolute; top: 2px; left: 2px;
    transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }
  .sch-toggle-inner.on .sch-toggle-dot { left: 18px; }
</style>
</head>
<body>
<div id="container">
  <div id="title"><span>课表</span><button id="closeBtn">&times;</button></div>
  <div class="sch-toggle">
    <span>周视图</span>
    <div class="sch-toggle-inner" id="toggle">
      <div class="sch-toggle-dot"></div>
    </div>
    <span>当天</span>
  </div>
  <div id="content"></div>
</div>
<script>
(function() {
  var DAYS = ['mon','tue','wed','thu','fri'];
  var LABELS = ['一','二','三','四','五'];
  var todayIdx = (new Date().getDay() + 6) % 7;
  if (todayIdx > 4) todayIdx = 0;
  var weekView = false;
  var periodConfig = null;
  var classSchedule = null;
  var toggle = document.getElementById('toggle');
  var content = document.getElementById('content');
  var closeBtn = document.getElementById('closeBtn');

  closeBtn.addEventListener('click', function() {
    if (window.electronAPI) window.electronAPI.closeSchedule();
  });

  toggle.addEventListener('click', function() {
    weekView = !weekView;
    toggle.classList.toggle('on', weekView);
    render();
  });

  function renderToday() {
    if (!periodConfig || !classSchedule) {
      content.innerHTML = '<div class="sch-empty">暂无课表数据</div>';
      return;
    }
    var day = DAYS[todayIdx];
    var courses = classSchedule[day] || [];
    var now = new Date();
    var cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var isToday = (now.getDay() + 6) % 7 === todayIdx;
    var html = '';
    periodConfig.periodTimes.forEach(function(pt, i) {
      var name = courses[i] || '';
      var isActive = isToday && cur >= pt.start && cur < pt.end;
      var isPast = isToday && cur >= pt.end;
      html += '<div class="sch-slot' + (isActive ? ' active':'') + (isPast ? ' past':'') + '">';
      html += '<span class="sch-time">' + pt.start + '-' + pt.end + '</span>';
      html += '<span class="sch-name">' + (name || '--') + '</span>';
      html += '</div>';
    });
    content.innerHTML = html || '<div class="sch-empty">当天无课程安排</div>';
  }

  function renderWeek() {
    if (!periodConfig || !classSchedule) {
      content.innerHTML = '<div class="sch-empty">暂无课表数据</div>';
      return;
    }
    var now = new Date();
    var cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var isToday = (now.getDay() + 6) % 7;
    var html = '<div class="sch-week-grid">';
    html += '<div class="sch-week-header"></div>';
    DAYS.forEach(function(d) {
      html += '<div class="sch-week-header">周' + LABELS[DAYS.indexOf(d)] + '</div>';
    });
    periodConfig.periodTimes.forEach(function(pt, i) {
      html += '<div class="sch-week-time">' + pt.start + '</div>';
      DAYS.forEach(function(d) {
        var courses = classSchedule[d] || [];
        var name = courses[i] || null;
        var active = isToday === DAYS.indexOf(d) && cur >= pt.start && cur < pt.end;
        html += '<div class="sch-week-cell' + (active ? ' active' : '') + (!name ? ' empty' : '') + '">';
        html += (name || '');
        html += '</div>';
      });
    });
    html += '</div>';
    content.innerHTML = html;
  }

  function render() {
    if (weekView) renderWeek(); else renderToday();
  }

  if (window.electronAPI && window.electronAPI.onScheduleData) {
    window.electronAPI.onScheduleData(function(pc, sc) {
      periodConfig = pc;
      classSchedule = sc;
      render();
    });
  }

  render();
  // Default to today view
  toggle.classList.remove('on');
})();
</script>
</body>
</html>
